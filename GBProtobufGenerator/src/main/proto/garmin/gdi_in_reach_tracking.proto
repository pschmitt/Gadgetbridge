syntax = "proto2";

package GDI.Proto.InReachTracking;
option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin.GdiLaunchMonitorService";
option java_outer_classname = "GdiInReachTracking";

import "garmin/gdi_data_types.proto";
import "garmin/gdi_core.proto";
import "garmin/gdi_generic_item_transfer.proto";

message ChangeUintListSettingRequest {
    required GDI.Proto.InReachTracking.UintListSettingValue value = 1;
}

message ChangeUintListSettingResponse {
    required GDI.Proto.InReachTracking.SettingError status = 1;
}

message CurrentSettingsRequest {
    required uint32 max_settings_version = 1;
}

message CurrentSettingsResponse {
    required GDI.Proto.InReachTracking.SettingError status = 1;
    optional GDI.Proto.InReachTracking.TrackingSettings settings = 2;
}

message DataTypeConfigExt {
    optional GDI.Proto.InReachTracking.TrackingPointDateRangeQuery point_date_range = 1;
}

message GenericItemReferenceExt {
    optional GDI.Proto.Core.LocationData tracking_point = 1;
}

message InReachTrackingService {
    optional GDI.Proto.InReachTracking.TrackingStateRequest tracking_state_request = 1;
    optional GDI.Proto.InReachTracking.TrackingStateResponse tracking_state_response = 2;
    optional GDI.Proto.InReachTracking.StartTrackingRequest start_tracking_request = 3;
    optional GDI.Proto.InReachTracking.StartTrackingResponse start_tracking_response = 4;
    optional GDI.Proto.InReachTracking.StopTrackingRequest stop_tracking_request = 5;
    optional GDI.Proto.InReachTracking.StopTrackingResponse stop_tracking_response = 6;
    optional GDI.Proto.InReachTracking.CurrentSettingsRequest current_settings_request = 7;
    optional GDI.Proto.InReachTracking.CurrentSettingsResponse current_settings_response = 8;
    optional GDI.Proto.InReachTracking.LegalUintListValuesRequest legal_uint_list_values_request = 9;
    optional GDI.Proto.InReachTracking.LegalUintListValuesResponse legal_uint_list_values_response = 10;
    optional GDI.Proto.InReachTracking.ChangeUintListSettingRequest change_uint_list_setting_request = 11;
    optional GDI.Proto.InReachTracking.ChangeUintListSettingResponse change_uint_list_setting_response = 12;
    optional GDI.Proto.InReachTracking.TrackingSubscribeRequest tracking_subscribe_request = 13;
    optional GDI.Proto.InReachTracking.TrackingSubscribeResponse tracking_subscribe_response = 14;
    optional GDI.Proto.InReachTracking.TrackingStatusNotification tracking_status_notification = 15;
    optional GDI.Proto.InReachTracking.LegalValuesChangedNotification legal_values_changed_notification = 16;
    optional GDI.Proto.InReachTracking.TrackingSessionNotification tracking_session_notification = 17;
    optional GDI.Proto.InReachTracking.TrackingPointNotification tracking_point_notification = 18;
}

message LegalUintListValuesRequest {
    required GDI.Proto.InReachTracking.UintListSetting setting = 1;
}

message LegalUintListValuesResponse {
    required GDI.Proto.InReachTracking.SettingError status = 1;
    optional GDI.Proto.InReachTracking.UintListSetting setting = 2;
    repeated uint32 legal_values = 3 [packed = false];
    repeated GDI.Proto.InReachTracking.UintListSettingSpecialValue legal_special_values = 4 [packed = false];
}

message LegalValuesChangedNotification {
    repeated GDI.Proto.InReachTracking.UintListSetting changed_uint_lists = 1 [packed = false];
}

enum SettingError {
    SETTING_ERROR_UNKNOWN = 0;
    SETTING_ERROR_OK = 1;
    SETTING_ERROR_GENERIC = 2;
    SETTING_ERROR_UNKNOWN_SETTING = 3;
    SETTING_ERROR_UNAVAILABLE_SETTING = 4;
    SETTING_ERROR_ILLEGAL_VALUE = 5;
}

message StartTrackingRequest {
}

message StartTrackingResponse {
    enum Status {
        UNKNOWN_STATUS = 0;
        OK = 1;
        GENERIC_ERROR = 2;
        ALREADY_TRACKING = 3;
        NOT_ACTIVATED = 4;
        MOVING_INTERVAL_IS_OFF = 5;
        UNSUPPORTED_BY_PLAN = 6;
    }

    required GDI.Proto.InReachTracking.StartTrackingResponse.Status status = 1;
}

message StopTrackingRequest {
}

message StopTrackingResponse {
    enum Status {
        UNKNOWN_STATUS = 0;
        OK = 1;
        GENERIC_ERROR = 2;
        STOP_DISALLOWED = 3;
        UNSUPPORTED_BY_PLAN = 4;
    }

    required GDI.Proto.InReachTracking.StopTrackingResponse.Status status = 1;
}

message TrackingPointDateRangeQuery {
    optional fixed32 date_begin = 1;
    optional fixed32 date_end = 2;
    optional uint32 point_limit = 3;
    optional GDI.Proto.DataTypes.UUID session_uuid = 4;
}

message TrackingPointInfo {
    enum PointStatus {
        TRACKING_POINT_STATUS_UNKNOWN = 0;
        FAILED = 1;
        PENDING = 2;
        COMPLETE = 3;
    }

    enum PointType {
        TRACKING_POINT_TYPE_UNKNOWN = 0;
        START = 1;
        NORMAL = 2;
        STOP = 3;
    }

    optional GDI.Proto.InReachTracking.TrackingState state = 1;
    optional GDI.Proto.InReachTracking.TrackingPointInfo.PointType type = 2;
    optional GDI.Proto.InReachTracking.TrackingPointInfo.PointStatus status = 3;
}

message TrackingPointNotification {
    repeated GDI.Proto.Core.LocationData points = 1 [packed = false];
}

message TrackingSessionInfo {
    optional GDI.Proto.DataTypes.UUID uuid = 1;
    optional fixed32 start_time = 2;
    optional fixed32 last_sent_timestamp = 3;
    optional bool send_pending = 4;
    optional float total_distance_m = 5;
}

message TrackingSessionNotification {
    optional GDI.Proto.InReachTracking.TrackingSessionInfo session_info = 1;
}

message TrackingSettings {
    required uint32 settings_version = 1;
    repeated GDI.Proto.InReachTracking.UintListSettingValue uint_list_values = 2 [packed = false];
}

enum TrackingState {
    TRACKING_STATE_OFF = 1;
    TRACKING_STATE_NORMAL = 2;
    TRACKING_STATE_EMERGENCY = 3;
}

message TrackingStateRequest {
}

message TrackingStateResponse {
    enum Status {
        UNKNOWN_STATUS = 0;
        OK = 1;
        GENERIC_ERROR = 2;
    }

    required GDI.Proto.InReachTracking.TrackingStateResponse.Status status = 1;
    optional GDI.Proto.InReachTracking.TrackingState tracking = 2;
    optional GDI.Proto.InReachTracking.TrackingSettings settings = 3;
    optional GDI.Proto.DataTypes.UUID session_uuid = 4;
    optional GDI.Proto.InReachTracking.TrackingSessionInfo session_info = 5;
}

message TrackingStatusNotification {
    required GDI.Proto.InReachTracking.TrackingState tracking = 1;
    optional GDI.Proto.InReachTracking.TrackingSettings settings = 2;
    optional GDI.Proto.DataTypes.UUID session_uuid = 3;
}

message TrackingSubscribeRequest {
    optional bool want_status = 1;
    optional bool want_legal_values_changed = 2;
    optional bool want_session = 3;
    optional bool want_point = 4;
}

message TrackingSubscribeResponse {
    enum Status {
        OK = 1;
        GENERIC_ERROR = 2;
    }

    required GDI.Proto.InReachTracking.TrackingSubscribeResponse.Status status = 1;
}

enum UintListSetting {
    MOVING_INTERVAL = 1;
    RESTING_INTERVAL = 2;
    RESTING_DISTANCE = 3;
}

enum UintListSettingSpecialValue {
    MOVING_INTERVAL_OFF = 1;
    RESTING_INTERVAL_SAME_AS_MOVING = 2;
    RESTING_DISTANCE_OFF = 3;
}

message UintListSettingValue {
    required GDI.Proto.InReachTracking.UintListSetting setting = 1;
    optional uint32 value = 2;
    optional GDI.Proto.InReachTracking.UintListSettingSpecialValue special = 3;
}

extend GDI.Proto.Core.LocationData {
    optional GDI.Proto.InReachTracking.TrackingPointInfo locationdata_inreach_tracking_ext = 1000;
}

extend GDI.Proto.GenericItemTransfer.DataTypeConfig {
    optional GDI.Proto.InReachTracking.DataTypeConfigExt config_ext = 101;
}

extend GDI.Proto.GenericItemTransfer.GenericItemReference {
    optional GDI.Proto.InReachTracking.GenericItemReferenceExt reference_ext = 101;
}
