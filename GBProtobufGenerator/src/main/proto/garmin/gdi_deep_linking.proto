syntax = "proto2";

package GDI.Proto.DeepLinking;
option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin.GdiLaunchMonitorService";
option java_outer_classname = "GdiDeepLinking";

message DeepLinkingService {
    optional GDI.Proto.DeepLinking.OpenDeepLinkingRequest deep_linking_request = 1;
    optional GDI.Proto.DeepLinking.OpenDeepLinkingResponse deep_linking_response = 2;
}

message OpenDeepLinkingRequest {
    repeated string schemas = 1 [packed = false];
}

message OpenDeepLinkingResponse {
    enum ResponseStatus {
        OK = 1;
        UNHANDLED = 2;
        UNKNOWN_ERROR = 3;
    }

    optional GDI.Proto.DeepLinking.OpenDeepLinkingResponse.ResponseStatus status = 1;
    optional int32 used_schema_index = 2;
}
