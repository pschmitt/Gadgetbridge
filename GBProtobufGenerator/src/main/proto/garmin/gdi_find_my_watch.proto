syntax = "proto2";

package GDI.Proto.FindMyWatch;
option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin";
option java_outer_classname = "GdiFindMyWatch";

message FindMyWatchCancelRequest {
}

message FindMyWatchCancelResponse {
    optional GDI.Proto.FindMyWatch.ResponseStatus status = 1;
}

message FindMyWatchRequest {
    optional int32 timeout = 1;
}

message FindMyWatchResponse {
    optional GDI.Proto.FindMyWatch.ResponseStatus status = 1;
}

message FindMyWatchService {
    optional GDI.Proto.FindMyWatch.FindMyWatchRequest find_request = 1;
    optional GDI.Proto.FindMyWatch.FindMyWatchResponse find_response = 2;
    optional GDI.Proto.FindMyWatch.FindMyWatchCancelRequest cancel_request = 3;
    optional GDI.Proto.FindMyWatch.FindMyWatchResponse cancel_response = 4;
}

enum ResponseStatus {
    UNKNOWN_RESPONSE_STATUS = 0;
    OK = 100;
    ERROR = 200;
}
