syntax = "proto2";

package GDI.Proto.DeviceStatus;
option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin";
option java_outer_classname = "GdiDeviceStatus";

message AppInitiatedPasscodeSetNotification {
    enum Source {
        GARMIN_PAY = 0;
        DEVICE_SETTINGS = 1;
    }

    optional GDI.Proto.DeviceStatus.AppInitiatedPasscodeSetNotification.Source source = 1;
}

message CapabilitiesRequest {
}

message CapabilitiesResponse {
    optional bool initial_setup_status_support = 1;
}

message DevicePasscodeInvalidAttemptNotification {
    optional uint32 attempts_remaining = 1;
}

message DeviceStatusService {
    optional GDI.Proto.DeviceStatus.RemoteDeviceBatteryStatusChangedNotification remote_device_battery_status_changed_notification = 1;
    optional GDI.Proto.DeviceStatus.RemoteDeviceBatteryStatusRequest remote_device_battery_status_request = 2;
    optional GDI.Proto.DeviceStatus.RemoteDeviceBatteryStatusResponse remote_device_battery_status_response = 3;
    optional GDI.Proto.DeviceStatus.GetCurrentActivityStatusRequest activity_status_request = 4;
    optional GDI.Proto.DeviceStatus.GetCurrentActivityStatusResponse activity_status_response = 5;
    optional GDI.Proto.DeviceStatus.GetInitialSetupStatusRequest initial_setup_status_request = 6;
    optional GDI.Proto.DeviceStatus.GetInitialSetupStatusResponse initial_setup_status_response = 7;
    optional GDI.Proto.DeviceStatus.DevicePasscodeInvalidAttemptNotification device_passcode_invalid_attempt_notification = 8;
    optional GDI.Proto.DeviceStatus.DeviceUnlockedNotification device_unlocked_notification = 9;
    optional GDI.Proto.DeviceStatus.SetDevicePasscodeRequest set_device_passcode_request = 10;
    optional GDI.Proto.DeviceStatus.SetDevicePasscodeResponse set_device_passcode_response = 11;
    optional GDI.Proto.DeviceStatus.AppInitiatedPasscodeSetNotification app_initiated_passcode_set_notification = 12;
    optional GDI.Proto.DeviceStatus.ResetPasscodeRequest reset_passcode_request = 13;
    optional GDI.Proto.DeviceStatus.ResetPasscodeResponse reset_passcode_response = 14;
    optional GDI.Proto.DeviceStatus.RegionRequiresPasscodeNotification region_requires_passcode_notification = 15;
}

message DeviceUnlockedNotification {
}

message GetCurrentActivityStatusRequest {
}

message GetCurrentActivityStatusResponse {
    enum ActivityStatus {
        OFF = 0;
        STOPPED = 1;
        PAUSED = 2;
        ON = 3;
    }

    optional GDI.Proto.DeviceStatus.GetCurrentActivityStatusResponse.ActivityStatus activity_status = 1;
}

message GetInitialSetupStatusRequest {
}

message GetInitialSetupStatusResponse {
    enum InitialSetupStatus {
        IN_INITIAL_SETUP = 0;
        SETUP_COMPLETE = 1;
        IN_SETUP_APPLYING_BACKUP = 2;
    }

    optional GDI.Proto.DeviceStatus.GetInitialSetupStatusResponse.InitialSetupStatus initial_setup_status = 1;
}

enum PasscodeResponseStatus {
    PASSCODE_STATUS_ERROR = 0;
    PASSCODE_STATUS_OK = 1;
    PASSCODE_STATUS_NFC_DEVICE = 2;
}

message RegionRequiresPasscodeNotification {
}

enum RemoteDeviceBatteryStatusBatteryStatus {
    UNKNOWN_STATUS = 0;
    NORMAL = 1;
    LOW = 2;
    CRITICAL = 3;
    CHARGING = 4;
    FULLY_CHARGED = 5;
    ERROR = 6;
    LOW_PULSE_OX = 7;
}

message RemoteDeviceBatteryStatusChangedNotification {
    optional GDI.Proto.DeviceStatus.RemoteDeviceBatteryStatusBatteryStatus status = 1;
}

message RemoteDeviceBatteryStatusRequest {
}

message RemoteDeviceBatteryStatusResponse {
    enum ResponseStatus {
        UNKNOWN_RESPONSE_STATUS = 0;
        OK = 1;
        NO_REMOTE_DEVICE = 2;
    }

    required GDI.Proto.DeviceStatus.RemoteDeviceBatteryStatusResponse.ResponseStatus status = 1;
    optional uint32 current_battery_level = 2;
    optional GDI.Proto.DeviceStatus.RemoteDeviceBatteryStatusBatteryStatus battery_status = 3;
    optional uint32 estimated_hours_remaining = 4;
}

message ResetPasscodeRequest {
}

message ResetPasscodeResponse {
    optional GDI.Proto.DeviceStatus.PasscodeResponseStatus response_status = 1;
}

message SetDevicePasscodeRequest {
    required string passcode = 1;
}

message SetDevicePasscodeResponse {
    optional GDI.Proto.DeviceStatus.PasscodeResponseStatus response_status = 1;
}
