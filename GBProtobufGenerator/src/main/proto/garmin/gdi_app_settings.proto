syntax = "proto2";

package GDI.Proto.ConnectIQAppSettings;
option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin";
option java_outer_classname = "GdiAppSettings";

message ConnectIQAppSettingsService {
    optional GDI.Proto.ConnectIQAppSettings.GetAppSettingsRequest get_app_settings_request = 1;
    optional GDI.Proto.ConnectIQAppSettings.GetAppSettingsResponse get_app_settings_response = 2;
    optional GDI.Proto.ConnectIQAppSettings.SaveAppSettingsRequest save_app_settings_request = 3;
    optional GDI.Proto.ConnectIQAppSettings.SaveAppSettingsResponse save_app_settings_response = 4;
    optional GDI.Proto.ConnectIQAppSettings.SendAppSettingsRequest send_app_settings_request = 5;
    optional GDI.Proto.ConnectIQAppSettings.SendAppSettingsResponse send_app_settings_response = 6;
    optional GDI.Proto.ConnectIQAppSettings.OpenAppSettingsRequest open_app_settings_request = 7;
    optional GDI.Proto.ConnectIQAppSettings.OpenAppSettingsResponse open_app_settings_response = 8;
    optional GDI.Proto.ConnectIQAppSettings.VerifyAppSettingsRequest verify_app_settings_request = 9;
    optional GDI.Proto.ConnectIQAppSettings.VerifyAppSettingsResponse verify_app_settings_response = 10;
    optional GDI.Proto.ConnectIQAppSettings.VerifiedAppSettingsNotification verified_app_settings_notification = 11;
}

message GetAppSettingsRequest {
    required bytes app_identifier = 1;
}

message GetAppSettingsResponse {
    enum Response {
        UNKNOWN_RESPONSE = 0;
        SUCCESS = 1;
        APP_NOT_INSTALLED = 2;
    }

    required bytes app_identifier = 1;
    optional GDI.Proto.ConnectIQAppSettings.GetAppSettingsResponse.Response response = 2;
}

message OpenAppSettingsRequest {
    required bytes store_uuid = 1;
}

message OpenAppSettingsResponse {
    enum ResponseStatus {
        UNKNOWN_RESPONSE = 0;
        SUCCESS = 1;
    }

    required bytes app_identifier = 1;
    required GDI.Proto.ConnectIQAppSettings.OpenAppSettingsResponse.ResponseStatus status = 2;
}

message SaveAppSettingsRequest {
    required bytes app_identifier = 1;
    optional bytes settings_values = 2;
}

message SaveAppSettingsResponse {
    enum Response {
        UNKNOWN_RESPONSE = 0;
        SUCCESS = 1;
        FAILED_TO_SAVE = 2;
    }

    required bytes app_identifier = 1;
    optional GDI.Proto.ConnectIQAppSettings.SaveAppSettingsResponse.Response response = 2;
}

message SendAppSettingsRequest {
    required bytes app_identifier = 1;
    optional bytes settings_values = 2;
}

message SendAppSettingsResponse {
    enum Response {
        UNKNOWN_RESPONSE = 0;
        SUCCESS = 1;
    }

    optional GDI.Proto.ConnectIQAppSettings.SendAppSettingsResponse.Response response = 1;
}

message VerifiedAppSettingsNotification {
    enum Result {
        VERIFIED = 0;
        UNKNOWN_ERROR = 1;
        APP_ERROR = 2;
        VERIFICIATION_FAILED = 3;
    }

    required bytes store_uuid = 1;
    optional bytes key = 2;
    optional GDI.Proto.ConnectIQAppSettings.VerifiedAppSettingsNotification.Result result = 3;
    optional bytes error = 4;
}

message VerifyAppSettingsRequest {
    required bytes store_uuid = 1;
    required bytes key = 2;
    optional bytes value = 3;
}

message VerifyAppSettingsResponse {
    enum ResponseStatus {
        UNKNOWN = 0;
        OK = 1;
        APP_NOT_INSTALLED = 2;
        APP_CANNOT_RUN = 3;
    }

    required bytes store_uuid = 1;
    optional GDI.Proto.ConnectIQAppSettings.VerifyAppSettingsResponse.ResponseStatus status = 2;
}
