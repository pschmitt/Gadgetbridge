syntax = "proto2";

package GDI.Proto.GroupLiveTrack;
option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin.GdiSmartProto";
option java_outer_classname = "GdiGroupLiveTrack";

import "garmin/gdi_data_types.proto";

message FitnessPointData {
    enum ActivityType {
        CYCLING = 0;
        RUNNING = 1;
        WALKING = 2;
        OTHER = 3;
        TRANSITION = 4;
        FITNESS_EQUIPMENT = 5;
        SWIMMING = 6;
        HIKING = 7;
        UNCATEGORIZED = 8;
        MOTOR_CYCLING = 9;
    }

}

message GetLastKnownLocationRequest {
    repeated string session_id = 1 [packed = false];
    optional uint64 user_profile_pk = 2;
}

message GetLastKnownLocationResponse {
    required GDI.Proto.GroupLiveTrack.GroupTrackResponse group_track_response = 1;
    repeated GDI.Proto.GroupLiveTrack.LiveConnectionTrackPoint track_points = 2 [packed = false];
    optional uint32 call_interval = 3;
    optional bool dirty = 4;
}

message GetLiveTrackConnectionsRequest {
    optional GDI.Proto.DataTypes.ScPoint position = 1;
    optional uint32 radius = 2;
    repeated GDI.Proto.GroupLiveTrack.FitnessPointData.ActivityType activity_type = 3 [packed = false];
}

message GetLiveTrackConnectionsResponse {
    required GDI.Proto.GroupLiveTrack.GroupTrackResponse group_track_response = 1;
    repeated GDI.Proto.GroupLiveTrack.LiveConnectionUserTrackPoint track_points = 2 [packed = false];
    optional uint32 call_interval = 3;
}

message GroupLiveTrackService {
    optional GDI.Proto.GroupLiveTrack.GetLiveTrackConnectionsRequest get_live_track_connections_request = 1;
    optional GDI.Proto.GroupLiveTrack.GetLiveTrackConnectionsResponse get_live_track_connections_response = 2;
    optional GDI.Proto.GroupLiveTrack.GetLastKnownLocationRequest get_last_known_location_request = 3;
    optional GDI.Proto.GroupLiveTrack.GetLastKnownLocationResponse get_last_known_location_response = 4;
}

message GroupTrackResponse {
    required bool success = 1;
    optional GDI.Proto.GroupLiveTrack.ResponseFailureStatus failureStatus = 2;
}

message LiveConnectionTrackPoint {
    required string session_id = 1;
    optional uint64 reported_timestamp = 2;
    optional GDI.Proto.DataTypes.ScPoint position = 3;
    optional double speed_mps = 4;
    optional sint32 heading_sc = 5;
    optional GDI.Proto.GroupLiveTrack.FitnessPointData.ActivityType activity_type = 6;
}

message LiveConnectionUserTrackPoint {
    required string user_display_name = 1;
    optional GDI.Proto.GroupLiveTrack.LiveConnectionTrackPoint track_point = 2;
    optional bool is_livetrack_messaging_available = 3;
}

enum ResponseFailureStatus {
    UNDEFINED = 0;
    NO_NETWORK_CONN = 1;
    TIMEOUT = 2;
    SERVER_ERROR = 3;
    EMPTY_SESSION_IDS_LIST = 4;
}
