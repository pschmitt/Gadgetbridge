syntax = "proto2";
package GDI.Proto.SimpleSetup;

option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin";
option java_outer_classname = "GdiSimpleSetup";

enum AlternateMode {
    NONE = 0;
    GYM = 1;
}

message AlternateModeRequest {
    optional GDI.Proto.SimpleSetup.AlternateMode requested_mode = 1;
}

message AlternateModeResponse {
    optional GDI.Proto.SimpleSetup.AlternateMode current_mode = 1;
}

message Feature {
    required GDI.Proto.SimpleSetup.FeatureType feature_type = 1;
    repeated int32 compatibility_id = 2 [packed = false];
}

enum FeatureType {
    ACTIVITY_PROFILE_MIGRATION = 1;
    SENSOR_PRE_PAIR = 2;
    POPULAR_PROFILES = 3;
    ALTERNATE_MODE = 4;
}

message SelectedRestoreListNotification {
    repeated GDI.Proto.SimpleSetup.FeatureType feature_type = 1 [packed = false];
}

message SelectedSensorListNotification {
    repeated GDI.Proto.SimpleSetup.SensorType sensor_type = 1 [packed = false];
}

enum SensorType {
    HEART_RATE = 1;
    POWER = 2;
    CADENCE = 3;
}

message SimpleSetupService {
    optional GDI.Proto.SimpleSetup.SupportedFeaturesListRequest supported_feature_list_request = 1;
    optional GDI.Proto.SimpleSetup.SupportedFeaturesListResponse supported_feature_list_response = 2;
    optional GDI.Proto.SimpleSetup.SelectedRestoreListNotification selected_restore_list_notification = 3;
    optional GDI.Proto.SimpleSetup.SelectedSensorListNotification selected_sensor_list_notification = 4;
    optional GDI.Proto.SimpleSetup.AlternateModeRequest alternate_mode_request = 5;
    optional GDI.Proto.SimpleSetup.AlternateModeResponse alternate_mode_response = 6;
}

message SupportedFeaturesListRequest {
}

message SupportedFeaturesListResponse {
    repeated GDI.Proto.SimpleSetup.Feature feature = 1 [packed = false];
}

