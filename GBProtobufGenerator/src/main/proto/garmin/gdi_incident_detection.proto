syntax = "proto2";

package GDI.Proto.IncidentDetection;
option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin";
option java_outer_classname = "GdiIncidentDetection";

import "garmin/gdi_data_types.proto";

message CancelIncidentRequest {
}

message CancelIncidentResponse {
    enum ResponseStatus {
        UNKNOWN = 0;
        SUCCESS = 100;
        ERROR = 200;
    }

    required GDI.Proto.IncidentDetection.CancelIncidentResponse.ResponseStatus status = 1;
}

message Contact {
    required string id = 1;
    optional string name = 2;
    repeated string telephone = 3 [packed = false];
    repeated string email_address = 4 [packed = false];
}

message IncidentDetectedRequest {
    enum RequestType {
        UNKNOWN = 0;
        CYCLING_INCIDENT = 1;
        ASSISTANCE_NEEDED = 2;
    }

    required GDI.Proto.DataTypes.ScPoint position = 1;
    required uint32 seconds_to_delay_before_notifying_contact_persons = 2;
    optional GDI.Proto.IncidentDetection.IncidentDetectedRequest.RequestType type = 3;
}

message IncidentDetectedResponse {
    enum ResponseStatus {
        UNKNOWN = 0;
        TIMER_STARTED = 100;
        ERROR = 200;
    }

    required GDI.Proto.IncidentDetection.IncidentDetectedResponse.ResponseStatus status = 1;
}

message IncidentDetectionService {
    optional GDI.Proto.IncidentDetection.UpdateDeviceOwnerRequest update_device_owner_request = 1;
    optional GDI.Proto.IncidentDetection.UpdateDeviceOwnerResponse update_device_owner_response = 2;
    optional GDI.Proto.IncidentDetection.UpdateIncidentContactsRequest update_incident_contacts_request = 3;
    optional GDI.Proto.IncidentDetection.UpdateIncidentContactsResponse update_incident_contacts_response = 4;
    optional GDI.Proto.IncidentDetection.IncidentDetectedRequest incident_detected_request = 5;
    optional GDI.Proto.IncidentDetection.IncidentDetectedResponse incident_detected_response = 6;
    optional GDI.Proto.IncidentDetection.CancelIncidentRequest cancel_incident_request = 7;
    optional GDI.Proto.IncidentDetection.CancelIncidentResponse cancel_incident_response = 8;
    optional GDI.Proto.IncidentDetection.IncidentStatusNotification incident_status_notification = 9;
    optional GDI.Proto.IncidentDetection.IncidentVideoNotification incident_video_notification = 10;
}

message IncidentStatusNotification {
    enum Status {
        UNKNOWN = 0;
        SENT_NOTIFICATIONS_TO_CONTACTS_SUCCESS = 1;
        SENT_NOTIFICATIONS_TO_CONTACTS_FAILURE = 2;
        FINISHED = 3;
    }

    required GDI.Proto.IncidentDetection.IncidentStatusNotification.Status status = 1;
}

message IncidentVideoNotification {
}

message UpdateDeviceOwnerRequest {
    optional string name = 1;
    optional string location = 2;
}

message UpdateDeviceOwnerResponse {
    enum ResponseStatus {
        UNKNOWN = 0;
        OK = 100;
        ERROR = 200;
    }

    required GDI.Proto.IncidentDetection.UpdateDeviceOwnerResponse.ResponseStatus status = 1;
}

message UpdateIncidentContactsRequest {
    repeated GDI.Proto.IncidentDetection.Contact contact = 1 [packed = false];
}

message UpdateIncidentContactsResponse {
    enum ResponseStatus {
        UNKNOWN = 0;
        OK = 100;
        ERROR = 200;
    }

    required GDI.Proto.IncidentDetection.UpdateIncidentContactsResponse.ResponseStatus status = 1;
}
