syntax = "proto2";

package GDI.Proto.Credentials;
option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin";
option java_outer_classname = "GdiCredentials";

message CapabilitiesRequest {
    repeated GDI.Proto.Credentials.CredentialType supported_credential_types = 1 [packed = false];
    optional bool support_sip_credentials = 2;
}

message CapabilitiesResponse {
}

enum CredentialType {
    ALPHA_IT_OAUTH_2 = 0;
    GENERIC_IT_OAUTH_2 = 1;
    AMAZON_MUSIC = 2;
}

message CredentialsService {
    optional GDI.Proto.Credentials.GCOAuthCredentialsRequest gc_oauth_request = 1;
    optional GDI.Proto.Credentials.GCOAuthCredentialsResponse gc_oauth_response = 2;
    optional GDI.Proto.Credentials.DIOAuth2CredentialsRequest di_oauth_2_request = 3;
    optional GDI.Proto.Credentials.DIOAuth2CredentialsResponse di_oauth_2_response = 4;
    optional GDI.Proto.Credentials.OAuth2CredentialsRequest oauth2_request = 5;
    optional GDI.Proto.Credentials.OAuth2CredentialsResponse oauth2_response = 6;
    optional GDI.Proto.Credentials.SIPCredentialsRequest sip_credentials_request = 7;
    optional GDI.Proto.Credentials.SIPCredentialsResponse sip_credentials_response = 8;
}

message DIOAuth2Credentials {
    optional string access_token = 1;
    optional string token_type = 2;
    optional string refresh_token = 3;
    optional uint32 expires_in = 4;
    optional string scope = 5;
    optional string jti = 6;
    optional uint32 refresh_token_expires_in = 7;
    optional string mfa_token = 8;
    optional string mfa_expiration_timestamp = 9;
    optional uint64 mfa_expiration_timestamp_ms = 10;
}

message DIOAuth2CredentialsRequest {
}

message DIOAuth2CredentialsResponse {
    optional GDI.Proto.Credentials.DIOAuth2Credentials credentials = 1;
    optional GDI.Proto.Credentials.GCSLocation gcs_location = 2;
}

message GCOAuthCredentialsRequest {
}

message GCOAuthCredentialsResponse {
    required GDI.Proto.Credentials.OAuthCredentials oauth_credentials = 1;
    required GDI.Proto.Credentials.GCSLocation gcs_location = 2;
}

enum GCSLocation {
    PRODUCTION = 0;
    CHINA = 1;
    TEST = 2;
    STAGE = 3;
}

message OAuth2Credentials {
    optional string access_token = 1;
    optional string token_type = 2;
    optional string refresh_token = 3;
    optional uint32 expires_in = 4;
    repeated string scope = 5 [packed = false];
    optional string jti = 6;
    optional uint32 refresh_token_expires_in = 7;
    optional string mfa_token = 8;
    optional uint64 mfa_expiration_timestamp_ms = 9;
}

message OAuth2CredentialsRequest {
    required GDI.Proto.Credentials.CredentialType credential_type = 1;
    optional string client_id = 2;
}

message OAuth2CredentialsResponse {
    required GDI.Proto.Credentials.CredentialType credential_type = 1;
    optional GDI.Proto.Credentials.OAuth2Credentials credentials = 2;
    optional GDI.Proto.Credentials.GCSLocation environment = 3;
}

message OAuthCredentials {
    required string consumer_key = 1;
    required string consumer_secret = 2;
    required string oauth_token = 3;
    required string oauth_secret = 4;
}

message SIPCredentials {
    optional string username = 1;
    optional string server = 2;
    optional string password = 3;
}

message SIPCredentialsRequest {
}

message SIPCredentialsResponse {
    optional GDI.Proto.Credentials.SIPCredentials credentials = 1;
}
