syntax = "proto2";

package GDI.Proto.SmsNotification;
option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin";
option java_outer_classname = "GdiSmsNotification";

enum CannedListType {
    PHONE_CALL_RESPONSE = 0;
    SMS_MESSAGE_RESPONSE = 1;
    GROUP_TRACK_RESPONSE = 2;
}

message CapabilitiesRequest {
}

message CapabilitiesResponse {
    repeated GDI.Proto.SmsNotification.CannedListType type = 1 [packed = false];
}

message SmsCannedList {
    optional GDI.Proto.SmsNotification.CannedListType type = 1;
    repeated string responses = 2 [packed = false];
}

message SmsCannedListChangedNotification {
    repeated GDI.Proto.SmsNotification.CannedListType changed_types = 1 [packed = false];
}

message SmsCannedListRequest {
    repeated GDI.Proto.SmsNotification.CannedListType requested_types = 1 [packed = false];
}

message SmsCannedListResponse {
    enum ResponseStatus {
        SUCCESS = 0;
        GENERIC_ERROR = 1;
    }

    optional GDI.Proto.SmsNotification.SmsCannedListResponse.ResponseStatus status = 1;
    repeated GDI.Proto.SmsNotification.SmsCannedList lists = 2 [packed = false];
}

message SmsNotificationService {
    optional GDI.Proto.SmsNotification.SmsSendMessageRequest sms_send_message_request = 1;
    optional GDI.Proto.SmsNotification.SmsSendMessageResponse sms_send_message_response = 2;
    optional GDI.Proto.SmsNotification.SmsCannedListChangedNotification sms_canned_list_changed_notification = 3;
    optional GDI.Proto.SmsNotification.SmsCannedListRequest sms_canned_list_request = 4;
    optional GDI.Proto.SmsNotification.SmsCannedListResponse sms_canned_list_response = 5;
}

message SmsSendMessageRequest {
    optional string receiver_number = 1;
    optional string message = 2;
}

message SmsSendMessageResponse {
    enum ResponseStatus {
        SUCCESS = 0;
        GENERIC_ERROR = 1;
    }

    optional GDI.Proto.SmsNotification.SmsSendMessageResponse.ResponseStatus status = 1;
}
