syntax = "proto2";

package GDI.Proto.GNCS;
option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin";
option java_outer_classname = "GdiGncs";

import "garmin/gdi_data_types.proto";

message AppStatus {
    enum Status {
        UNKNOWN = 0;
        BLOCKED = 1;
        ALLOWED = 2;
    }

    optional string package_id = 1;
    optional string name = 2;
    optional GDI.Proto.GNCS.AppStatus.Status status = 3;
}

message AppStatusRequest {
    enum Status {
        UNKNOWN = 0;
        BLOCKED = 1;
        ALL = 2;
    }

    optional GDI.Proto.GNCS.AppStatusRequest.Status status = 1;
}

message AppStatusResponse {
    repeated GDI.Proto.GNCS.AppStatus apps = 1 [packed = false];
}

message BlockedAppsHashNotification {
    optional bytes blocked_apps_hash = 1;
}

message CapabilitiesRequest {
    optional uint32 np_version = 1;
    optional GDI.Proto.GNCS.NotificationDisabledReason notification_disabled_reason = 2;
    optional string default_messaging_app_id = 3;
    optional string default_dialer_app_id = 4;
}

message CapabilitiesResponse {
    optional uint32 nc_version = 1;
    optional bool support_blocked_apps = 2;
}

message DisplayAttributes {
    optional uint32 width_px = 1;
    optional uint32 height_px = 2;
    optional uint32 max_byte_size = 3;
    optional uint32 quality = 4;
}

message MediaRequest {
    optional uint32 notification_uid = 1;
    optional uint32 index = 2;
    optional GDI.Proto.GNCS.DisplayAttributes attributes = 3;
    repeated GDI.Proto.GNCS.MediaType supported_types = 4 [packed = false];
}

message MediaResponse {
    enum Status {
        UNKNOWN = 0;
        SUCCESS = 1;
        INVALID_UID = 2;
        INVALID_INDEX = 3;
    }

    optional GDI.Proto.GNCS.MediaResponse.Status status = 1;
    optional uint32 notification_uid = 2;
    optional uint32 index = 3;
    optional GDI.Proto.GNCS.MediaType type = 4;
    optional GDI.Proto.DataTypes.DataTransferItem transfer_info = 5;
}

enum MediaType {
    PNG = 0;
    JPEG = 1;
}

enum NotificationDisabledReason {
    LOW_RAM_MOBILE_DEVICE = 1;
    PERMISSION_NOT_GRANTED = 2;
    SERVICE_NOT_BOUND = 3;
}

message Service {
    optional GDI.Proto.GNCS.MediaRequest media_request = 1;
    optional GDI.Proto.GNCS.MediaResponse media_response = 2;
    optional GDI.Proto.GNCS.BlockedAppsHashNotification blocked_app_hash_notification = 3;
    optional GDI.Proto.GNCS.AppStatusRequest app_status_request = 4;
    optional GDI.Proto.GNCS.AppStatusResponse app_status_response = 5;
}
