syntax = "proto2";

package GDI.Proto.EventSharing;
option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.garmin";
option java_outer_classname = "GdiEventSharing";

import "garmin/gdi_accessory_utilities.proto";
import "garmin/gdi_heart_rate.proto";
import "garmin/gdi_launch_monitor.proto";
import "garmin/gdi_live_session.proto";
import "garmin/gdi_running.proto";

message ActivityAlertDetails {
    optional uint32 total_distance = 1;
    optional uint32 total_time = 2;
    optional uint32 lap_time = 3;
    optional uint32 average_pace = 4;
    optional GDI.Proto.EventSharing.Sport sport_type = 5;
    optional uint32 est_finish_time = 6;
    optional uint32 lap_number = 7;
    optional uint32 session_dist = 8;
    optional uint32 session_time = 9;
    optional uint32 local_time = 10;
    optional GDI.Proto.EventSharing.Sport last_sport_type = 11;
    optional uint32 interval_dist = 12;
    optional uint32 interval_time = 13;
}

message AlertMessage {
    optional GDI.Proto.EventSharing.AlertType type = 1;
    optional uint32 interval = 2;
}

message AlertNotification {
    repeated GDI.Proto.EventSharing.AlertType alert_type = 1 [packed = false];
    optional GDI.Proto.EventSharing.ActivityAlertDetails activity_details = 2;

    extensions 1000;
    optional GDI.Proto.LaunchMonitor.AlertDetails launch_monitor = 1001;
    extensions 1002 to 1011;
    optional GDI.Proto.LiveSession.LiveSessionEventNotification live_session = 1012;
    optional GDI.Proto.HeartRate.MeasurementNotification heart_rate = 1013;
    optional GDI.Proto.Running.MeasurementNotification running_measurement = 1014;
    optional GDI.Proto.AccessoryUtilities.ActivityStateNotification accessory_utilities = 1015;
    optional GDI.Proto.Running.AlgorithmInputNotification running_algorithm = 1016;
    extensions 1017 to max;
}

message AlertSupportRequest {
}

message AlertSupportResponse {
    repeated GDI.Proto.EventSharing.AlertType supported_alerts = 1 [packed = false];
    repeated uint32 version_num = 2 [packed = false];
}

enum AlertType {
    ACTIVITY_START = 0;
    ACTIVITY_STOP = 1;
    ACTIVITY_DISTANCE = 2;
    ACTIVITY_TIME = 3;
    ACTIVITY_AUTO_LAP = 4;
    ACTIVITY_MANUAL_LAP = 5;
    ACTIVITY_TRANSITION = 6;
    SWITCHER_STATUS_CHANGE = 7;
    LAUNCH_MONITOR = 8;
    NAVIGATION_UPDATE = 9;
    BREAK_PLANNER_STATE_CHANGE = 10;
    DRIVING_STATE_CHANGE = 11;
    BLUETOOTH_CLASSIC_STATE_CHANGE = 12;
    GOLF_STATE_CHANGE = 13;
    RANGEFINDER_MEASUREMENT = 14;
    XERO_CHRONOGRAPH = 15;
    GOLF_CLUB_STATUS_CHANGE = 16;
    DIVE_READINESS_CHANGE = 17;
    RADAR_SETTINGS_CHANGE = 18;
    LIVE_SESSION = 19;
    HEART_RATE_MEASUREMENT = 20;
    RUNNING_MEASUREMENT = 21;
    ACCESSORY_UTILITIES_ACTIVITY_STATE = 22;
    RUNNING_ALGORITHM_INPUT = 23;
    BIKE_POWER_MEASUREMENT = 24;
    DEVELOPMENT_TESTING = 25;
    PSA_SAMPLE = 26;
    VARIA_DEVICE_STATUS = 27;
    BUTTON_EVENT = 28;
    CYCLING_TORSO_SENSOR_MEASUREMENT = 29;
    XCEL_STRENGTH = 30;
    CONTROLLING_DEVICE_STATUS_CHANGE = 31;
    XCEL_SPRINT = 32;
    XERO_RANGEFINDER = 33;
    XCEL_SPRINT_SENSOR_STATE = 34;
}

message EventSharingService {
    optional GDI.Proto.EventSharing.SubscribeRequest subscribe_request = 1;
    optional GDI.Proto.EventSharing.SubscribeResponse subscribe_response = 2;
    optional GDI.Proto.EventSharing.AlertNotification alert_notification = 3;
    optional GDI.Proto.EventSharing.AlertSupportRequest support_request = 4;
    optional GDI.Proto.EventSharing.AlertSupportResponse support_response = 5;
}

message Sport {
    required uint32 sport_fit_type = 1;
    required uint32 sport_fit_sub_type = 2;
}

message SubscribeRequest {
    repeated GDI.Proto.EventSharing.AlertMessage alerts = 1 [packed = false];
    optional uint32 target_distance = 2;
}

message SubscribeResponse {
    message AlertStatusMessage {
        enum Status {
            SUCCESS = 0;
            FAIL = 1;
        }

        required GDI.Proto.EventSharing.SubscribeResponse.AlertStatusMessage.Status subscribe_status = 1;
        optional GDI.Proto.EventSharing.AlertMessage type = 2;
    }

    repeated GDI.Proto.EventSharing.SubscribeResponse.AlertStatusMessage alert_status = 1 [packed = false];
}
