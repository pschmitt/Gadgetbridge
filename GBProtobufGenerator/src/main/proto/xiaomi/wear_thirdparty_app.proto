syntax = "proto2";
package xiaomi;
option java_package = "nodomain.freeyourgadget.gadgetbridge.proto.xiaomi";
option java_multiple_files = true;

message Rpk{
  optional RpkList rpkList = 1;

  optional RpkInfo rpkInfo = 2;
  optional RpkInfoList rpkDel = 5;

  optional RpkInstallStart rpkInstallStart = 3;

  // 20, 4 - launch the wear app before messaging it; band answers 20, 6 with rpkDel set to the app
  optional RpkLaunch rpkLaunch = 6;
  // 20, 7 - end of a message session
  optional RpkSessionEnd rpkSessionEnd = 8;
  // 20, 8 - message for the wear app
  optional RpkMessage rpkMessage = 9;
}

message RpkLaunch {
  optional RpkInfoList app = 1; // id + sha from the rpk list
  optional string wearPackage = 2; // package of the app on the band; the band also accepts the rpk id
}

message RpkSessionEnd {
  optional RpkInfoList app = 1;
  optional uint32 unknown2 = 2; // 1
}

message RpkMessage {
  optional RpkInfoList app = 1;
  optional bytes payload = 2;
}

message RpkList {
  repeated RpkInfoList rpkInfo = 1;
}

message RpkInfo {
  optional string id = 1;
  optional uint32 size = 3;
  optional uint32 unknown2 = 2; // 0
}

message RpkInfoList {
  optional string id = 1;
  optional string name = 5;
  optional bytes sha = 2;
  optional uint32 unknown3 = 3;
  optional uint32 unknown4 = 4;
}

message RpkInstallStart {
  optional uint32 cmd = 1;
}
